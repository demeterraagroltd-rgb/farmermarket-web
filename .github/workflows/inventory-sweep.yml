name: Daily inventory sweep

# InventoryService.runDailySweep: releases stock held by orders that have sat
# in pending_approval longer than INVENTORY_RESERVATION_DAYS (default 7), then
# emails active admins one digest of low-stock products and lots expiring
# within 30 days. Sends nothing when there's nothing to report.
#
# Setup: reuses the same two repo secrets as the other scheduled runs —
#   COLLECTIONS_API_URL     e.g. https://farmermarket-api-nsjd.onrender.com
#   COLLECTIONS_CRON_SECRET the same value set on the API's env
on:
  schedule:
    - cron: "0 6 * * *" # 07:00 Lagos (WAT = UTC+1), before the warehouse opens
  workflow_dispatch: {} # allow a manual run from the Actions tab

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: POST /v1/inventory/cron
        env:
          API_URL: ${{ secrets.COLLECTIONS_API_URL }}
          CRON_SECRET: ${{ secrets.COLLECTIONS_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${API_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "COLLECTIONS_API_URL / COLLECTIONS_CRON_SECRET repo secrets are not set." >&2
            exit 1
          fi
          # Render free tier can be cold — one retry after a short wait.
          for attempt in 1 2; do
            if curl -fsS --max-time 300 -X POST "$API_URL/v1/inventory/cron" \
                 -H "x-cron-secret: $CRON_SECRET" \
                 -H "content-type: application/json" -d '{}' ; then
              echo
              echo "inventory sweep ok (attempt $attempt)"
              exit 0
            fi
            echo "attempt $attempt failed; retrying in 30s" >&2
            sleep 30
          done
          echo "inventory sweep failed after 2 attempts" >&2
          exit 1
