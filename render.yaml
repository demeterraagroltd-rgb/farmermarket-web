# The only Render-specific file in the repo (§4.4, portability rule #1).
# Everything it points at is a plain Dockerfile, so the eventual AWS move
# is "build image, push to ECR, run on ECS/App Runner" rather than a rewrite.
#
# Everything below runs on Render's free tier. Two things that implies:
# - farmermarket-postgres expires 30 days after creation unless upgraded —
#   fine for early testing, but put a reminder somewhere before that date.
# - farmermarket-api "spins down" after 15 minutes of inactivity and takes
#   a few seconds to wake back up on the next request. Expected on free.
#
# farmermarket-worker (BullMQ) is deliberately NOT included yet — Render has
# no free tier for background workers, and the worker has no real jobs to
# run yet anyway (see apps/worker/src/index.ts). Add it back here, on a paid
# plan, once there's an actual job to run.

databases:
  - name: farmermarket-postgres
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"

services:
  - type: web
    name: farmermarket-api
    runtime: docker
    dockerfilePath: ./infra/docker/Dockerfile.api
    plan: free
    region: frankfurt
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: farmermarket-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: redis
          name: farmermarket-redis
          property: connectionString
      - key: CORS_ORIGINS
        value: https://farmermarket-web-api.vercel.app,http://localhost:3000
      # Cloudinary — media store for catalog images AND private KYC documents
      # (POST /v1/kyc/documents). Required now. Set the real value in the
      # Render dashboard. Format: cloudinary://<key>:<secret>@<cloud>
      - key: CLOUDINARY_URL
        sync: false
      # Resend — transactional email (account, application, order, repayment
      # and verification updates). Until this is set, EmailService logs a
      # dry-run line and nothing breaks. EMAIL_FROM's domain must be a
      # verified sender domain in Resend.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Farmer Market <noreply@farmermarket.ng>
      # Where customer replies land — a monitored inbox, not the unattended
      # `from` address.
      - key: EMAIL_REPLY_TO
        value: admin@farmermarket.ng
      # Termii — SMS for Sign Up phone verification. Set the key in the Render
      # dashboard. Until it's set the OTP endpoints still work but log the
      # code instead of texting it, so registration can't be tested with a
      # real phone. TERMII_SENDER_ID must be an approved sender ID.
      - key: TERMII_API_KEY
        sync: false
      - key: TERMII_SENDER_ID
        value: Demeterra
      - key: TERMII_CHANNEL
        value: dnd
      # Shared secret for the daily collections run (POST /v1/collections/cron,
      # triggered by the GitHub Actions workflow). Must match the repo secret
      # COLLECTIONS_CRON_SECRET. Set it in the Render dashboard.
      - key: COLLECTIONS_CRON_SECRET
        sync: false
      # Mono Connect — bank linking for KYC income verification. SECRET key
      # only. MONO_WEBHOOK_SECRET must match the value in the Mono dashboard
      # under the app's Webhooks (URL there: <api>/v1/webhooks/mono). Unset ⇒
      # the fake client is used. Set both in the Render dashboard.
      - key: MONO_SECRET_KEY
        sync: false
      - key: MONO_WEBHOOK_SECRET
        sync: false
      # Mono Lookup — BVN/NIN identity verification. A *separate* Mono app
      # from Connect with its own secret key, and never borrowed from
      # MONO_SECRET_KEY: unset ⇒ the fake client, which stamps every result
      # "Sandbox — not verified" in the review workspace. Set it here too, or
      # production quietly runs identity checks against canned data.
      - key: MONO_LOOKUP_SECRET_KEY
        sync: false
      # BVN encryption — the no-consent admin identity check (BVN + NIN +
      # date of birth, no OTP). Must be the SAME value used wherever else
      # this database is written to (see apps/api/.env.example for how to
      # generate one) — a BVN encrypted under one key can't be decrypted
      # under another. Unset ⇒ that check just isn't offered.
      - key: BVN_ENCRYPTION_KEY
        sync: false
      # Inbox — reads and replies to admin@farmermarket.ng inside the
      # dashboard (§ staff Inbox section). IMAP for receiving, SMTP for
      # sending; most hosts (Zoho, cPanel, Google Workspace) use the same
      # user/password for both. Until INBOX_IMAP_HOST is set the inbox stays
      # empty and replies are refused, same "unset ⇒ off" pattern as every
      # other integration here. Set these in the Render dashboard once the
      # mailbox exists.
      - key: INBOX_IMAP_HOST
        sync: false
      - key: INBOX_IMAP_PORT
        value: "993"
      - key: INBOX_SMTP_HOST
        sync: false
      - key: INBOX_SMTP_PORT
        value: "465"
      - key: INBOX_EMAIL_USER
        value: admin@farmermarket.ng
      - key: INBOX_EMAIL_PASSWORD
        sync: false
      - key: INBOX_EMAIL_FROM
        value: Farmer Market <admin@farmermarket.ng>
      # POST /v1/inbox/sync (GitHub Actions cron) reuses the same shared
      # secret as the collections run — both are machine-triggered, neither
      # touches the staff table, no need for a second secret.

  - type: redis
    name: farmermarket-redis
    plan: free
    region: frankfurt
    ipAllowList: []
