# The only Render-specific file in the repo (§4.4, portability rule #1).
# Everything it points at is a plain Dockerfile, so the eventual AWS move
# is "build image, push to ECR, run on ECS/App Runner" rather than a rewrite.

databases:
  - name: farmermarket-postgres
    plan: standard
    region: frankfurt
    postgresMajorVersion: "16"

services:
  - type: web
    name: farmermarket-api
    runtime: docker
    dockerfilePath: ./infra/docker/Dockerfile.api
    region: frankfurt
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: farmermarket-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: redis
          name: farmermarket-redis
          property: connectionString

  - type: worker
    name: farmermarket-worker
    runtime: docker
    dockerfilePath: ./infra/docker/Dockerfile.worker
    region: frankfurt
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: farmermarket-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: farmermarket-redis
          property: connectionString

  - type: redis
    name: farmermarket-redis
    plan: standard
    region: frankfurt
    ipAllowList: []
